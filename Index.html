<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SilverChat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #eee8ff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: #9b7bea;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 22px;
    }

    .logout {
      border: none;
      background: white;
      color: #7d5dcc;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* USER LIST */
    #userList {
      flex: 1;
      overflow-y: auto;
      background: #faf9ff;
    }

    .user {
      padding: 15px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .user:hover {
      background: #f0ebff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #b59bf2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-right: 12px;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
      color: #333;
    }

    .user-email {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px;
    }

    /* CHAT */
    #chatScreen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      background: #9b7bea;
      color: white;
      padding: 14px;
      display: flex;
      align-items: center;
    }

    .back {
      background: none;
      border: none;
      color: white;
      font-size: 25px;
      margin-right: 12px;
      cursor: pointer;
    }

    .chat-user-name {
      font-size: 18px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #f4f0ff;
    }

    .message {
      max-width: 75%;
      padding: 9px 12px;
      margin-bottom: 9px;
      border-radius: 14px;
      word-wrap: break-word;
      font-size: 15px;
    }

    .sent {
      background: #cbb9f8;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .received {
      background: white;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .sender {
      font-size: 10px;
      color: #777;
      margin-bottom: 3px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 12px 15px;
      outline: none;
      font-size: 15px;
    }

    #sendBtn {
      margin-left: 8px;
      width: 48px;
      border: none;
      border-radius: 50%;
      background: #9b7bea;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    /* LOGIN */
    #loginScreen {
      display: none;
      height: 100%;
      padding: 30px;
      justify-content: center;
      flex-direction: column;
    }

    #loginScreen h1 {
      color: #8b6bd6;
      text-align: center;
      margin-bottom: 25px;
    }

    .login-input {
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .login-btn {
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #9b7bea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .signup-btn {
      padding: 13px;
      border: 1px solid #9b7bea;
      border-radius: 8px;
      background: white;
      color: #8b6bd6;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      text-align: center;
      color: #d33;
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>💜 SilverChat</h1>

    <input
      id="email"
      class="login-input"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      class="login-input"
      type="password"
      placeholder="Password"
    >

    <input
      id="name"
      class="login-input"
      type="text"
      placeholder="Name (for new account)"
    >

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <button class="signup-btn" id="signupBtn">
      Create Account
    </button>

    <div id="status"></div>
  </div>


  <!-- HOME -->
  <div id="homeScreen" style="display:none; height:100%; flex-direction:column;">

    <div class="header">
      <h2>💜 SilverChat</h2>
      <button class="logout" id="logoutBtn">
        Logout
      </button>
    </div>

    <div id="userList">
      <div class="empty">
        Loading users...
      </div>
    </div>

  </div>


  <!-- PRIVATE CHAT -->
  <div id="chatScreen">

    <div class="chat-header">

      <button class="back" id="backBtn">
        ←
      </button>

      <div class="chat-user-name" id="chatUserName">
        Chat
      </div>

    </div>

    <div id="messages"></div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
      >

      <button id="sendBtn">
        ➤
      </button>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    off
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBSwhnN9SALp80USfwC_J5lUp7pNMTSxbs",
  authDomain: "silve-rchat.firebaseapp.com",
  databaseURL: "https://silve-rchat-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "silve-rchat",
  storageBucket: "silve-rchat.firebasestorage.app",
  messagingSenderId: "322304576160",
  appId: "1:322304576160:web:c9e971a5c4c494670357c5",
  measurementId: "G-DDM9DTSJQB"
};


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  /* HTML */

  const loginScreen = document.getElementById("loginScreen");
  const homeScreen = document.getElementById("homeScreen");
  const chatScreen = document.getElementById("chatScreen");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const nameInput = document.getElementById("name");

  const status = document.getElementById("status");

  const userList = document.getElementById("userList");

  const messages = document.getElementById("messages");

  const messageInput = document.getElementById("messageInput");

  const chatUserName = document.getElementById("chatUserName");


  let currentUser = null;
  let selectedUser = null;
  let messagesRef = null;


  /* LOGIN */

  document.getElementById("loginBtn").addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      status.textContent = "Email and password enter pannunga";
      return;
    }

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      status.textContent = "";

    } catch (error) {

      status.textContent = error.message;

    }

  });


  /* SIGN UP */

  document.getElementById("signupBtn").addEventListener("click", async () => {

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!name || !email || !password) {
      status.textContent = "Name, email, password enter pannunga";
      return;
    }

    if (password.length < 6) {
      status.textContent = "Password minimum 6 characters";
      return;
    }

    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      await updateProfile(result.user, {
        displayName: name
      });

      /* SAVE USER */

      await set(
        ref(db, "users/" + result.user.uid),
        {
          name: name,
          email: email,
          uid: result.user.uid
        }
      );

      status.textContent = "";

    } catch (error) {

      status.textContent = error.message;

    }

  });


  /* AUTH */

  onAuthStateChanged(auth, async (user) => {

    currentUser = user;

    if (user) {

      loginScreen.style.display = "none";

      chatScreen.style.display = "none";

      homeScreen.style.display = "flex";

      /*
       Existing account created before
       this private chat code may not
       have a users/ record.
      */

      if (user.displayName) {

        await set(
          ref(db, "users/" + user.uid),
          {
            name: user.displayName,
            email: user.email || "",
            uid: user.uid
          }
        );

      }

      loadUsers();

    } else {

      loginScreen.style.display = "flex";

      homeScreen.style.display = "none";

      chatScreen.style.display = "none";

    }

  });


  /* LOAD USERS */

  function loadUsers() {

    const usersRef = ref(db, "users");

    onValue(usersRef, (snapshot) => {

      userList.innerHTML = "";

      if (!snapshot.exists()) {

        userList.innerHTML =
          '<div class="empty">No users yet</div>';

        return;

      }

      let foundUser = false;

      snapshot.forEach((child) => {

        const user = child.val();

        /* Don't show myself */

        if (
          currentUser &&
          user.uid === currentUser.uid
        ) {
          return;
        }

        foundUser = true;

        const div = document.createElement("div");

        div.className = "user";

        const firstLetter =
          (user.name || "?").charAt(0).toUpperCase();

        div.innerHTML = `
          <div class="avatar">${firstLetter}</div>

          <div>
            <div class="user-name">
              ${escapeHTML(user.name || "User")}
            </div>

            <div class="user-email">
              ${escapeHTML(user.email || "")}
            </div>
          </div>
        `;

        div.addEventListener("click", () => {

          openChat(user);

        });

        userList.appendChild(div);

      });

      if (!foundUser) {

        userList.innerHTML =
          '<div class="empty">No other users found</div>';

      }

    });

  }


  /* OPEN PRIVATE CHAT */

  function openChat(user) {

    selectedUser = user;

    homeScreen.style.display = "none";

    chatScreen.style.display = "flex";

    chatUserName.textContent =
      user.name || "User";

    messages.innerHTML = "";

    loadMessages();

  }


  /* CREATE SAME CHAT ID FOR BOTH USERS */

  function getChatId(uid1, uid2) {

    return [uid1, uid2]
      .sort()
      .join("_");

  }


  /* LOAD PRIVATE MESSAGES */

  function loadMessages() {

    if (!currentUser || !selectedUser) return;

    if (messagesRef) {

      off(messagesRef);

    }

    const chatId =
      getChatId(
        currentUser.uid,
        selectedUser.uid
      );

    messagesRef =
      ref(db, "chats/" + chatId + "/messages");

    onValue(messagesRef, (snapshot) => {

      messages.innerHTML = "";

      if (!snapshot.exists()) {

        return;

      }

      snapshot.forEach((child) => {

        const msg = child.val();

        const div =
          document.createElement("div");

        div.className =
          "message " +
          (
            msg.senderId === currentUser.uid
              ? "sent"
              : "received"
          );

        div.innerHTML = `
          <div class="sender">
            ${escapeHTML(msg.senderName || "User")}
          </div>

          <div>
            ${escapeHTML(msg.text || "")}
          </div>
        `;

        messages.appendChild(div);

      });

      messages.scrollTop =
        messages.scrollHeight;

    });

  }


  /* SEND MESSAGE */

  async function sendMessage() {

    const text =
      messageInput.value.trim();

    if (
      !text ||
      !currentUser ||
      !selectedUser
    ) {
      return;
    }

    const chatId =
      getChatId(
        currentUser.uid,
        selectedUser.uid
      );

    const newMessage =
      push(
        ref(
          db,
          "chats/" +
          chatId +
          "/messages"
        )
      );

    await set(newMessage, {

      senderId: currentUser.uid,

      senderName:
        currentUser.displayName ||
        currentUser.email ||
        "User",

      receiverId:
        selectedUser.uid,

      text: text,

      timestamp: Date.now()

    });

    messageInput.value = "";

  }


  document
    .getElementById("sendBtn")
    .addEventListener(
      "click",
      sendMessage
    );


  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );


  /* BACK */

  document
    .getElementById("backBtn")
    .addEventListener(
      "click",
      () => {

        if (messagesRef) {

          off(messagesRef);

          messagesRef = null;

        }

        selectedUser = null;

        chatScreen.style.display = "none";

        homeScreen.style.display = "flex";

      }
    );


  /* LOGOUT */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        if (messagesRef) {

          off(messagesRef);

          messagesRef = null;

        }

        await signOut(auth);

      }
    );


  /* SECURITY: HTML ESCAPE */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
