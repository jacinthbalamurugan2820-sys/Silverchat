<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SilverChat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#100018;color:#fff;min-height:100vh}.hidden{display:none!important}
button{border:0;cursor:pointer}input{outline:none}
.page{min-height:100vh}.login{display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#4b1975,#100018 70%)}
.card{width:100%;max-width:390px;background:#1d0829;border:1px solid #793aa0;border-radius:25px;padding:28px;box-shadow:0 0 35px #8c36bd55}
.logo{text-align:center;color:#e5b5ff;font-size:32px;font-weight:bold}.subtitle{text-align:center;color:#bfa8ca;margin:8px 0 25px}
.input,.search input,.profileInput{width:100%;padding:14px;margin:6px 0;border:1px solid #62327b;border-radius:13px;background:#290d39;color:#fff;font-size:15px}
.btn,.profileButton{width:100%;padding:14px;margin-top:10px;border-radius:13px;background:linear-gradient(90deg,#7028ed,#c13cff);color:#fff;font-size:16px;font-weight:bold}.alt{background:#351047;color:#e2b0ff}
.status{text-align:center;color:#ff9bad;font-size:13px;min-height:20px;margin-top:10px}
.top{height:65px;padding:0 14px;background:#1b0627;border-bottom:1px solid #5b2477;display:flex;align-items:center;justify-content:space-between}
.title{font-size:22px;font-weight:bold;color:#e0aaff}.topButtons{display:flex;gap:8px}
.round{width:42px;height:42px;border-radius:50%;background:#351047;color:#fff;font-size:18px}
.search{padding:12px}.users{padding:8px}.user{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:8px;border-radius:16px;background:#1d082a;border:1px solid #401650}
.avatar,.chatavatar{flex:none;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#762cff,#d13cff);font-size:20px;font-weight:bold}
.info{min-width:0}.name{font-size:17px;font-weight:bold}.email{font-size:12px;color:#b9a2c2;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;color:#a995af;padding:35px}
.chathead{height:65px;display:flex;align-items:center;gap:10px;padding:0 9px;background:#1b0627;border-bottom:1px solid #5c2478}
.chatavatar{width:42px;height:42px}.chatinfo{flex:1}.chatname{font-size:17px;font-weight:bold}.chatmail{font-size:11px;color:#b9a2c2;margin-top:3px}
.msgs{height:calc(100vh - 130px);overflow-y:auto;padding:14px 12px 80px}.bubble{max-width:78%;padding:9px 12px;margin-bottom:8px;border-radius:16px;background:#2b1238;word-wrap:break-word}.mine{margin-left:auto;background:linear-gradient(135deg,#7024b5,#9839da);border-bottom-right-radius:5px}.theirs{border-bottom-left-radius:5px}
.sender{font-size:10px;color:#ddaaff;margin-bottom:3px}.time{display:block;text-align:right;font-size:9px;color:#d7c5df;margin-top:4px}
.composer{position:fixed;left:0;right:0;bottom:0;height:65px;padding:9px;display:flex;gap:8px;background:#1b0627;border-top:1px solid #572176}.composer input{flex:1;min-width:0;padding:13px;border-radius:20px;border:1px solid #60258a;background:#250b34;color:#fff;font-size:15px}.send{width:48px;border-radius:50%;background:linear-gradient(135deg,#762cff,#c13cff);color:#fff;font-size:18px}
.profile{background:radial-gradient(circle at top,#411461,#100018 65%)}.profileHead{height:65px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#1b0627;border-bottom:1px solid #5c2478}.profileTitle{font-size:20px;font-weight:bold;color:#e0aaff}
.profileBox{max-width:420px;margin:30px auto;padding:25px;margin-left:15px;margin-right:15px;background:#1d0829;border:1px solid #743695;border-radius:25px;text-align:center;box-shadow:0 0 30px #7d32a044}
.bigAvatar{width:105px;height:105px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#762cff,#d13cff);font-size:42px;font-weight:bold;border:3px solid #d49aff}
.profileName{font-size:24px;font-weight:bold;color:#f0cfff}.profileEmail{margin-top:7px;color:#bba5c4;font-size:13px;word-break:break-all}.logoutButton{background:#45152f;color:#ffb4d2}
.popup{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20}.popcard{width:280px;padding:20px;background:#25102f;border:1px solid #8e45b8;border-radius:20px;text-align:center}.popcard button{width:100%;padding:12px;border-radius:12px;margin-top:8px;background:#7629a5;color:#fff}.popcard .cancel{background:#40204e}
</style>
</head>
<body>

<section id="login" class="page login"><div class="card">
<div class="logo">💜 SilverChat</div><div class="subtitle">Royal Violet Messenger</div>
<input id="name" class="input" type="text" placeholder="Name">
<input id="email" class="input" type="email" placeholder="Email">
<input id="password" class="input" type="password" placeholder="Password">
<button id="loginBtn" class="btn">Login</button><button id="signupBtn" class="btn alt">Create Account</button>
<div id="status" class="status"></div></div></section>

<section id="home" class="page hidden">
<div class="top"><div class="title">💜 SilverChat</div><div class="topButtons"><button id="profileBtn" class="round">👤</button><button id="logoutBtn" class="round">↪</button></div></div>
<div class="search"><input id="search" type="text" placeholder="Search users..."></div>
<div id="users" class="users"><div class="empty">Loading users...</div></div>
</section>

<section id="chat" class="page hidden">
<div class="chathead"><button id="backBtn" class="round">←</button><div id="chatAvatar" class="chatavatar">U</div>
<div class="chatinfo"><div id="chatName" class="chatname">User</div><div id="chatEmail" class="chatmail"></div></div>
<button id="deleteChatBtn" class="round">🗑</button></div>
<div id="messages" class="msgs"></div>
<div class="composer"><input id="messageInput" type="text" placeholder="Type a message..."><button id="sendBtn" class="send">➤</button></div>
</section>

<section id="profile" class="page profile hidden">
<div class="profileHead"><button id="profileBackBtn" class="round">←</button><div class="profileTitle">My Profile</div></div>
<div class="profileBox"><div id="bigAvatar" class="bigAvatar">U</div><div id="profileName" class="profileName">User</div>
<div id="profileEmail" class="profileEmail"></div><input id="editName" class="profileInput" type="text" placeholder="Enter new name">
<button id="saveNameBtn" class="profileButton">✏️ Save Name</button><button id="profileLogoutBtn" class="profileButton logoutButton">🚪 Logout</button>
<div id="profileStatus" class="status"></div></div></section>

<div id="messagePopup" class="popup hidden"><div class="popcard"><b>Delete this message?</b><button id="deleteMessageBtn">🗑 Delete Message</button><button id="cancelMessageBtn" class="cancel">Cancel</button></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getDatabase,ref,set,push,onValue,off,remove}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBSwhnN9SALp80USfwC_J5lUp7pNMTSxbs",
authDomain:"silve-rchat.firebaseapp.com",
databaseURL:"https://silve-rchat-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"silve-rchat",
storageBucket:"silve-rchat.firebasestorage.app",
messagingSenderId:"322304576160",
appId:"1:322304576160:web:c9e971a5c4c494670357c5",
measurementId:"G-DDM9DTSJQB"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
let currentUser=null,selectedUser=null,userListener=null,messageListener=null,deleteMessageKey=null;

function showPage(id){
["login","home","chat","profile"].forEach(x=>$(x).classList.add("hidden"));
$(id).classList.remove("hidden");
}
function firstLetter(name){return name?name.charAt(0).toUpperCase():"U"}
function chatId(a,b){return[a,b].sort().join("_")}
function errorText(e){
const m={"auth/invalid-credential":"Email or password is incorrect.","auth/email-already-in-use":"Email already exists.","auth/invalid-email":"Enter a valid email.","auth/weak-password":"Password must be at least 6 characters.","auth/network-request-failed":"Check your internet connection."};
return m[e.code]||e.message||"Something went wrong.";
}
async function saveUser(user,name){
await set(ref(db,"users/"+user.uid),{uid:user.uid,name:name||user.displayName||"User",email:user.email||""});
}

$("loginBtn").onclick=async()=>{
const email=$("email").value.trim(),password=$("password").value;
if(!email||!password){$("status").textContent="Enter email and password.";return}
try{await signInWithEmailAndPassword(auth,email,password);$("status").textContent=""}catch(e){$("status").textContent=errorText(e)}
};

$("signupBtn").onclick=async()=>{
const name=$("name").value.trim(),email=$("email").value.trim(),password=$("password").value;
if(!name||!email||!password){$("status").textContent="Enter name, email and password.";return}
if(password.length<6){$("status").textContent="Password must be at least 6 characters.";return}
try{
const r=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(r.user,{displayName:name});await saveUser(r.user,name);$("status").textContent="";
}catch(e){$("status").textContent=errorText(e)}
};

onAuthStateChanged(auth,async user=>{
currentUser=user;
if(user){await saveUser(user,user.displayName||user.email||"User");showPage("home");loadUsers()}
else{
if(userListener)off(userListener);if(messageListener)off(messageListener);
userListener=null;messageListener=null;selectedUser=null;showPage("login");
}
});

function loadUsers(){
if(userListener)off(userListener);
userListener=ref(db,"users");
onValue(userListener,s=>{
const box=$("users");box.innerHTML="";let found=0;
s.forEach(c=>{
const u=c.val();if(!currentUser||u.uid===currentUser.uid)return;found++;
const item=document.createElement("div");item.className="user";
const av=document.createElement("div");av.className="avatar";av.textContent=firstLetter(u.name);
const info=document.createElement("div");info.className="info";
const n=document.createElement("div");n.className="name";n.textContent=u.name||"User";
const em=document.createElement("div");em.className="email";em.textContent=u.email||"";
info.append(n,em);item.append(av,info);item.onclick=()=>openChat(u);box.appendChild(item);
});
if(!found)box.innerHTML='<div class="empty">No other users yet.</div>';filterUsers();
});
}
$("search").oninput=filterUsers;
function filterUsers(){
const q=$("search").value.toLowerCase().trim();
document.querySelectorAll(".user").forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?"flex":"none");
}

function openChat(u){
if(!currentUser||!u?.uid)return;selectedUser=u;
$("chatName").textContent=u.name||"User";$("chatEmail").textContent=u.email||"";$("chatAvatar").textContent=firstLetter(u.name);
$("messages").innerHTML="";showPage("chat");loadMessages();setTimeout(()=>$("messageInput").focus(),100);
}

function loadMessages(){
if(!currentUser||!selectedUser)return;if(messageListener)off(messageListener);
messageListener=ref(db,"chats/"+chatId(currentUser.uid,selectedUser.uid)+"/messages");
onValue(messageListener,s=>{
const box=$("messages");box.innerHTML="";
if(!s.exists()){box.innerHTML='<div class="empty">Start chatting 💜</div>';return}
s.forEach(c=>renderMessage(c.val(),c.key));box.scrollTop=box.scrollHeight;
});
}

function renderMessage(m,key){
const b=document.createElement("div");b.className="bubble "+(m.senderId===currentUser.uid?"mine":"theirs");
if(m.senderId!==currentUser.uid){const sender=document.createElement("div");sender.className="sender";sender.textContent=m.senderName||"User";b.appendChild(sender)}
const text=document.createElement("div");text.textContent=m.text||"";b.appendChild(text);
const time=document.createElement("span");time.className="time";
if(m.timestamp)time.textContent=new Date(m.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
b.appendChild(time);
if(m.senderId===currentUser.uid){
let timer=null;
b.oncontextmenu=e=>{e.preventDefault();openMessageDelete(key)};
b.ontouchstart=()=>{timer=setTimeout(()=>openMessageDelete(key),650)};
b.ontouchend=()=>{if(timer)clearTimeout(timer)};
b.ontouchmove=()=>{if(timer)clearTimeout(timer)};
}
$("messages").appendChild(b);
}

async function sendMessage(){
const text=$("messageInput").value.trim();if(!text||!currentUser||!selectedUser)return;
try{
const id=chatId(currentUser.uid,selectedUser.uid),r=push(ref(db,"chats/"+id+"/messages"));
await set(r,{senderId:currentUser.uid,senderName:currentUser.displayName||currentUser.email||"User",receiverId:selectedUser.uid,text,timestamp:Date.now()});
$("messageInput").value="";$("messageInput").focus();
}catch(e){alert(errorText(e))}
}
$("sendBtn").onclick=sendMessage;
$("messageInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}};
$("backBtn").onclick=()=>{if(messageListener)off(messageListener);messageListener=null;selectedUser=null;showPage("home")};

function openMessageDelete(key){deleteMessageKey=key;$("messagePopup").classList.remove("hidden")}
$("cancelMessageBtn").onclick=()=>{deleteMessageKey=null;$("messagePopup").classList.add("hidden")};
$("deleteMessageBtn").onclick=async()=>{
if(!deleteMessageKey||!currentUser||!selectedUser)return;
try{await remove(ref(db,"chats/"+chatId(currentUser.uid,selectedUser.uid)+"/messages/"+deleteMessageKey))}
catch(e){alert(errorText(e))}
deleteMessageKey=null;$("messagePopup").classList.add("hidden");
};

$("deleteChatBtn").onclick=async()=>{
if(!currentUser||!selectedUser)return;
if(!confirm("Delete this entire chat?"))return;
try{
await remove(ref(db,"chats/"+chatId(currentUser.uid,selectedUser.uid)));
if(messageListener)off(messageListener);messageListener=null;selectedUser=null;showPage("home");
}catch(e){alert(errorText(e))}
};

function loadProfile(){
const n=currentUser.displayName||"User",em=currentUser.email||"";
$("bigAvatar").textContent=firstLetter(n);$("profileName").textContent=n;$("profileEmail").textContent=em;$("editName").value=n;$("profileStatus").textContent="";
}
$("profileBtn").onclick=()=>{if(currentUser){loadProfile();showPage("profile")}};
$("profileBackBtn").onclick=()=>showPage("home");

$("saveNameBtn").onclick=async()=>{
const n=$("editName").value.trim();if(!n){$("profileStatus").textContent="Enter your name.";return}
try{
await updateProfile(currentUser,{displayName:n});await saveUser(currentUser,n);
$("profileName").textContent=n;$("bigAvatar").textContent=firstLetter(n);
$("profileStatus").style.color="#a8ffca";$("profileStatus").textContent="Profile updated successfully.";
}catch(e){$("profileStatus").style.color="#ff9bad";$("profileStatus").textContent=errorText(e)}
};

async function logoutUser(){
if(messageListener)off(messageListener);if(userListener)off(userListener);
messageListener=null;userListener=null;selectedUser=null;await signOut(auth);
}
$("logoutBtn").onclick=logoutUser;$("profileLogoutBtn").onclick=logoutUser;
</script>
</body>
</html>
